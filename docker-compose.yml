services:
  backend:
    build: ./backend
    container_name: dreamproject-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # model key is hardcoded as a fallback in model/client.go
      # override if you rotate it:
      # - HETZNER_INFERENCE_API_TOKEN=...
    volumes:
      - dreamproject-data:/app/data

volumes:
  dreamproject-data: