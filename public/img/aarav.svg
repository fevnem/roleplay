<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Aarav">
  <defs>
    <radialGradient id="aura" cx="50%" cy="36%" r="75%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#e8b98f"/>
      <stop offset="100%" stop-color="#d19a6e"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2320"/>
      <stop offset="100%" stop-color="#171210"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c26"/>
      <stop offset="100%" stop-color="#0f0f16"/>
    </linearGradient>
  </defs>

  <!-- aura -->
  <rect width="512" height="512" fill="#0c0a09"/>
  <circle cx="256" cy="200" r="250" fill="url(#aura)"/>
  <circle cx="256" cy="206" r="118" fill="#000" opacity="0.25"/>

  <!-- shoulders / shirt -->
  <path d="M120 512 C120 410 160 366 256 366 C352 366 392 410 392 512 Z" fill="url(#shirt)"/>
  <path d="M120 512 C120 410 160 366 256 366 C352 366 392 410 392 512 Z" fill="none" stroke="#f97316" stroke-width="5" opacity="0.5"/>
  <!-- collar zip -->
  <path d="M256 366 L256 512" stroke="#f97316" stroke-width="4" opacity="0.6"/>

  <!-- neck -->
  <path d="M222 350 C222 390 226 408 256 408 C286 408 290 390 290 350 Z" fill="#c99267"/>
  <!-- neck shadow -->
  <path d="M230 372 C240 394 272 394 282 372 Z" fill="#b07f55" opacity="0.55"/>

  <!-- ears -->
  <ellipse cx="176" cy="252" rx="20" ry="26" fill="#d19a6e"/>
  <ellipse cx="336" cy="252" rx="20" ry="26" fill="#d19a6e"/>

  <!-- face -->
  <ellipse cx="256" cy="252" rx="82" ry="104" fill="url(#skin)"/>
  <ellipse cx="256" cy="262" rx="80" ry="98" fill="#e8b98f" opacity="0.35"/>

  <!-- back hair -->
  <path d="M172 236 C150 176 176 128 256 128 C340 128 366 178 344 242 C340 260 334 250 334 250 C348 200 330 152 256 156 C180 160 164 206 176 252 C170 248 166 244 172 236 Z" fill="url(#hair)"/>

  <!-- eyebrows -->
  <path d="M198 226 Q216 214 238 224" stroke="#241b16" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M274 224 Q296 214 314 226" stroke="#241b16" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <g>
    <ellipse cx="218" cy="252" rx="30" ry="22" fill="#5b3414"/>
    <ellipse cx="218" cy="252" rx="24" ry="17" fill="#d08a2c"/>
    <circle cx="212" cy="247" r="8" fill="#fff" opacity="0.9"/>
    <circle cx="226" cy="258" r="4" fill="#fff" opacity="0.5"/>
    <path d="M186 240 Q218 232 250 240" stroke="#2a1408" stroke-width="4" fill="none"/>
    <ellipse cx="294" cy="252" rx="30" ry="22" fill="#5b3414"/>
    <ellipse cx="294" cy="252" rx="24" ry="17" fill="#d08a2c"/>
    <circle cx="288" cy="247" r="8" fill="#fff" opacity="0.9"/>
    <circle cx="302" cy="258" r="4" fill="#fff" opacity="0.5"/>
    <path d="M262 240 Q294 232 326 240" stroke="#2a1408" stroke-width="4" fill="none"/>
  </g>

  <!-- nose -->
  <path d="M256 272 Q260 282 254 288" stroke="#c07f52" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- mouth: sly confident grin -->
  <path d="M236 300 Q256 316 280 302" stroke="#8a3f2c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M254 306 L262 306 L258 312 Z" fill="#fff" opacity="0.85"/>

  <!-- front hair fringe -->
  <path d="M174 238 C150 178 178 120 256 124 C300 126 322 140 336 168 C314 132 282 120 256 124 C208 130 180 172 174 238 Z" fill="url(#hair)"/>
  <path d="M200 150 C210 96 268 86 312 116 C344 138 356 178 344 210 C340 190 332 170 318 158 C304 200 286 220 260 224 C268 196 286 180 300 168 C260 150 240 150 200 150 Z" fill="#1e1a18"/>
  <!-- hair shine -->
  <path d="M210 150 C238 126 288 128 312 150" stroke="#4a3a33" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- body outline stroke -->
  <rect width="512" height="512" fill="none" stroke="#f97316" stroke-width="0" />
</svg>